<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết xe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <h1>Thông tin chi tiết xe</h1>
  <button onclick="goBack()">← Quay lại</button>
</header>

<main class="detail-container">
  <img id="car-image" class="detail-image">

  <h2 id="car-name"></h2>
  <p id="car-price" class="price"></p>

  <table class="specs">
    <tr><td>Hãng</td><td id="brand"></td></tr>
    <tr><td>Năm</td><td id="year"></td></tr>
    <tr><td>Động cơ</td><td id="engine"></td></tr>
    <tr><td>Công suất</td><td id="power"></td></tr>
    <tr><td>Tăng tốc</td><td id="acceleration"></td></tr>
    <tr><td>Tốc độ tối đa</td><td id="topSpeed"></td></tr>
    <tr><td>Dẫn động</td><td id="drivetrain"></td></tr>
    <tr><td>Xuất xứ</td><td id="origin"></td></tr>
  </table>

  <p id="description" class="description"></p>
</main>

<script src="js/data.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
