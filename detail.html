<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết xe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <h1>Chi tiết xe</h1>
  <nav>
    <a href="index.html">← Quay về</a>
  </nav>
</header>

<main class="detail-container">

  <div class="detail-image">
    <img id="car-image" src="" alt="">
  </div>

  <div class="detail-info">
    <h2 id="car-name"></h2>
    <p id="car-brand"></p>
    <p id="car-year"></p>
    <p class="price" id="car-price"></p>

    <h3>Thông số kỹ thuật</h3>
    <ul class="specs">
      <li>Động cơ: <span id="engine"></span></li>
      <li>Công suất: <span id="power"></span></li>
      <li>0–100 km/h: <span id="acceleration"></span></li>
      <li>Tốc độ tối đa: <span id="topSpeed"></span></li>
      <li>Dẫn động: <span id="drivetrain"></span></li>
      <li>Xuất xứ: <span id="origin"></span></li>
    </ul>

    <h3>Mô tả</h3>
    <p id="description"></p>

    <button onclick="addToCart()">🛒 Thêm giỏ hàng</button>
    <button onclick="orderCar()">📋 Đặt xe</button>
    <button onclick="goBack()">← Quay lại</button>

  </div>

</main>
  
<script src="js/cars.js"></script>
<script src="js/detail.js"></script>
</body>
</html>
