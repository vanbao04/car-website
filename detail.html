<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết xe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <h1> Showroom Xe Cao Cấp</h1>
</header>

<main class="detail-container">
  <div class="detail-card">

    <!-- Ảnh xe -->
    <div class="detail-image">
      <span id="car-tag" class="tag"></span>
      <img id="car-image" src="" alt="Xe hơi">
    </div>

    <!-- Thông tin xe -->
    <div class="detail-info">
      <h2 id="car-name"></h2>
      <p id="car-brand"></p>
      <p id="car-price" class="price"></p>

      <div class="actions">
        <button class="btn primary">
          📞 Liên hệ mua
        </button>

        <button class="btn outline" onclick="goBack()">
          ← Quay lại
        </button>
      </div>
    </div>

  </div>
</main>

<footer class="footer">
  <p>© 2026 Car Shop</p>
</footer>

<script src="js/detail.js"></script>
</body>
</html>
