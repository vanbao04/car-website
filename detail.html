<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết xe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <h1>Chi tiết xe</h1>
  <nav><a href="index.html">← Quay về</a></nav>
</header>

<main class="detail-container">
  <div class="detail-image">
    <img id="car-image">
  </div>

  <div class="detail-info">
    <h2 id="car-name"></h2>
    <p id="car-brand"></p>
    <p id="car-year"></p>
    <p class="price" id="car-price"></p>

    <ul class="specs">
      <li>Động cơ: <span id="engine"></span></li>
      <li>Công suất: <span id="power"></span></li>
      <li>0–100 km/h: <span id="acceleration"></span></li>
      <li>Tốc độ tối đa: <span id="topSpeed"></span></li>
      <li>Dẫn động: <span id="drivetrain"></span></li>
      <li>Xuất xứ: <span id="origin"></span></li>
    </ul>

    <p id="description"></p>

    <button onclick="addToCart()">🛒 Thêm giỏ hàng</button>
    <button onclick="orderCar()">📋 Đặt xe</button>
  </div>
</main>

<!-- FORM MUA XE -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeOrder()">×</span>

    <h2>📝 Đặt mua xe</h2>

    <form id="orderForm">
      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="customerName" required>
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="customerPhone" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="customerEmail">
      </div>

      <div class="form-group">
        <label>Ngày nhận xe</label>
        <input type="date" id="deliveryDate">
      </div>

      <div class="form-group">
        <label>Ghi chú</label>
        <textarea id="note" rows="3"></textarea>
      </div>

      <button type="submit" class="btn-primary">
         Xác nhận đặt xe
      </button>
    </form>
  </div>
</div>

<script src="js/cars.js"></script>
<script src="js/detail.js"></script>
<script src="js/order.js"></script>

</body>
</html>
