<div id="paymentModal" class="modal">
  <div class="modal-box">
    <h2>💳 Thanh toán</h2>

    <input id="buyerName" placeholder="Họ tên">
    <input id="buyerPhone" placeholder="Số điện thoại">
    <select id="paymentMethod">
      <option>Chuyển khoản ngân hàng</option>
      <option>Tiền mặt tại showroom</option>
      <option>Trả góp</option>
    </select>

    <button onclick="confirmPayment()">Xác nhận thanh toán</button>
    <button class="cancel" onclick="closePayment()">Hủy</button>
  </div>
</div>
